<style>
:root{--bg:#14101c;--card:#201a2e;--ac:#c0392b;--tx:#eee;--mu:#a99fc0}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{padding:20px 16px;background:#0d0a14;border-bottom:2px solid var(--ac);position:sticky;top:0;z-index:5}
h1{margin:0 0 10px;font-size:1.3rem}
#q{width:100%;padding:12px;font-size:1rem;border-radius:8px;border:1px solid #444;background:#2a2340;color:var(--tx)}
.filters{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 11px;border-radius:99px;border:1px solid #554a73;background:transparent;color:var(--mu);cursor:pointer;font-size:.85rem}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
main{max-width:900px;margin:0 auto;padding:14px}
#count{color:var(--mu);font-size:.85rem;margin-bottom:10px}
.card{background:var(--card);border-radius:10px;padding:12px 14px;margin-bottom:10px;border-left:4px solid var(--ac)}
.card h3{margin:0 0 4px;font-size:1.05rem}
.tag{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:99px;background:#3a3057;color:#d6caf5;margin-right:5px}
.r{margin-top:6px;color:#ddd;font-size:.92rem}
.n{margin-top:4px;color:var(--mu);font-size:.82rem}
mark{background:#f1c40f;color:#000;border-radius:3px}
footer{text-align:center;color:var(--mu);font-size:.78rem;padding:20px}
.card{cursor:pointer}
.card h3::after{content:" ▾";color:var(--mu);font-size:.8rem}
.card.open h3::after{content:" ▴"}
.how{display:none;margin-top:8px;padding:8px 10px;background:#2a2340;border-radius:8px;font-size:.85rem;color:#ddd}
.card.open .how{display:block}
.how ol{margin:4px 0 6px 18px;padding:0}
a{color:#e8a0a0}
</style>

function norm(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function chips(id,arr,st){var el=document.getElementById(id);arr.forEach(function(v){var b=document.createElement("button");b.className="chip";b.textContent=v;b.onclick=function(){st[v]=!st[v];b.classList.toggle("on");render()};el.appendChild(b)})}
function hl(t,q){t=esc(t);if(!q)return t;var i=norm(t).indexOf(q);return i<0?t:t.slice(0,i)+"<mark>"+t.slice(i,i+q.length)+"</mark>"+t.slice(i+q.length)}
function steps(d){
 var parts=d[3].split(" + "),li=parts.map(function(p){
  return "<li>"+esc(p.replace(/\s*\(max\)/i," (al massimo livello)"))+"</li>"}).join("");
 return '<div class="how"><b>Come si sblocca</b><ol>'+li+'</ol>'+esc(HOW[d[1]]+(d[4]?" "+d[4]:""))+'</div>'}
function render(){
 var q=norm(document.getElementById("q").value.trim());
 var ae=exps.filter(function(x){return fe[x]}),at=types.filter(function(x){return ft[x]});
 var out=D.filter(function(d){
  if(ae.length&&ae.indexOf(d[0])<0)return false;
  if(at.length&&at.indexOf(d[1])<0)return false;
  return !q||norm(d[2]+" "+d[3]+" "+d[0]+" "+d[1]).indexOf(q)>=0});
 document.getElementById("count").textContent=out.length+" risultati su "+D.length;
 document.getElementById("list").innerHTML=out.map(function(d){
  return '<div class="card" tabindex="0"><h3>'+hl(d[2],q)+'</h3><span class="tag">'+d[1]+'</span><span class="tag">'+d[0]+'</span><div class="r"><b>Ingredienti:</b> '+hl(d[3],q)+'</div>'+steps(d)+'</div>'}).join("")||'<p>Nessun risultato.</p>';
}
chips("fe",exps,fe);chips("ft",types,ft);
document.getElementById("q").addEventListener("input",render);
document.getElementById("list").addEventListener("click",function(e){
 if(e.target.closest("a"))return;
 var c=e.target.closest(".card");if(c)c.classList.toggle("open")});
document.getElementById("list").addEventListener("keydown",function(e){
 if(e.key==="Enter"||e.key===" "){var c=e.target.closest(".card");if(c){e.preventDefault();c.classList.toggle("open")}}});
render();
</script>
